# 1. Підключення до MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/booking_bot?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Перевірка схеми від Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# 3. Liquibase для накатування міграцій
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Контекст
server.servlet.context-path=/api
# не забудь включити або видалити коли будеш працювати з докером
spring.docker.compose.enabled=false
