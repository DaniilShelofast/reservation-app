databaseChangeLog:
  - changeSet:
      id: create-role-table
      author: user
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: role_name
                  type: varchar(50)
                  constraints:
                    nullable: false

  - changeSet:
      id: add-roles
      author: user
      changes:
        - insert:
            tableName: roles
            columns:
              - column:
                  name: role_name
                  value: 'ROLE_USER'

        - insert:
            tableName: roles
            columns:
              - column:
                  name: role_name
                  value: 'ROLE_ADMIN'
