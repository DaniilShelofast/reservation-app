databaseChangeLog:
  - changeSet:
      id: create-users-roles-table
      author: user
      changes:
        - createTable:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: bigint
                  constraints:
                    nullable: false

            constraints:
              primaryKey: true
              primaryKeyName: pk_users_roles
              primaryKeyTablespace: users_roles
              columnNames: user_id, role_id